Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sc8280xp/HiFi-Dragon-Q8B.conf"
	Comment "HiFi quality Music."
}

# Raw ALSA control names (amixer's merged simple name "HPHL" is NOT a valid
# cset target; the kernel controls are "HPHL Switch"/"HPHR Switch").
BootSequence [
	cset "name='HPHL Switch' on"
	cset "name='HPHR Switch' on"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
