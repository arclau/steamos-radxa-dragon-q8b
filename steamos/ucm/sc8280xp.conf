# Radxa Dragon Q8B (SC8280XP SBC). Matched by DMI product_name.
# Root cause this branch exists: the stock file's X13s-only False.Error
# aborts UCM import for every non-ThinkPad board -> PipeWire falls back to
# auto_null -> games have no sink. See devlog/2026-10-03-26 + 2026-10-03-27.
If.RadxaQ8B {
	Condition {
		Type RegexMatch
		String "${sys:devices/virtual/dmi/id/product_name}"
		Regex "Radxa Dragon Q8B.*"
	}
	True.Include.q8b.File "/Qualcomm/sc8280xp/Radxa-Dragon-Q8B.conf"
}

If.LENOVOX13s {
	Condition {
		Type RegexMatch
		String "${sys:devices/virtual/dmi/id/board_vendor}-${sys:devices/virtual/dmi/id/product_family}"
		Regex "LENOVO.*ThinkPad X13s.*"
	}
	True.Include.x13s.File "/Qualcomm/sc8280xp/LENOVO-X13s.conf"
}
