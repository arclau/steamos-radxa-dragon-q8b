# Use case configuration for Radxa Dragon Q8B (SC8280XP SBC).
# DP0 = USB-C0, DP1 = USB-C1, DP2 = HDMI bridge (CH7218A). DP paths verified
# working on hardware (2026-10-03). Headphones = WCD938x, pending
# (2026-10-03); included for completeness, not default.
# Jack controls DO exist on this kernel: read-only CARD-iface booleans
# "DP0 Jack"/"DP1 Jack"/"DP2 Jack" (registered by qcom_snd_dp_jack_setup(),
# sound/soc/qcom/common.c:266) reflect the real ELD/plug state per DP path.
# Wiring them as JackControl makes PipeWire report per-port availability and
# lets WirePlumber auto-select the sink whose port actually has a display.
# Without this all ports are "availability unknown" and the default sink is
# pinned to the highest PlaybackPriority (DP1) even when nothing is plugged
# there -> silence after the cable lands on another port (2026-10-03).
# (An earlier note here wrongly claimed there were no jacks.)

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia3' 1"
		cset "name='DISPLAY_PORT_RX_2 Audio Mixer MultiMedia4' 1"

		# DSP per-stream gain. Driver default is VOL_CTRL_DEFAULT_GAIN=0x2000
		# (8192) which is audibly too quiet on the DP path; max it to unity.
		# PipeWire does NOT manage these controls (software volume only), so
		# without this the game output stays ~13% and sounds faint.
		# Names are truncated to 43 chars by the ALSA 44-byte id limit.
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 65535"
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 65535"
		cset "name='stream2.vol_ctrl2 MultiMedia3 Playback Volu' 65535"
		cset "name='stream3.vol_ctrl3 MultiMedia4 Playback Volu' 65535"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."DP0" {
	Comment "DisplayPort 0 playback (USB-C port 0)"

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},1"
		JackControl "DP0 Jack"
	}
}

SectionDevice."DP1" {
	Comment "DisplayPort 1 playback (USB-C port 1)"

	Value {
		PlaybackPriority 310
		PlaybackPCM "hw:${CardId},2"
		JackControl "DP1 Jack"
	}
}

SectionDevice."DP2" {
	Comment "DisplayPort 2 playback (HDMI port)"

	Value {
		PlaybackPriority 305
		PlaybackPCM "hw:${CardId},3"
		JackControl "DP2 Jack"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback (WCD938x, pending)"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}
